<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa Hàng Trực Tuyến</title>
    <!-- Fix: Thêm link Bootstrap 5 chuẩn -->
    <link href="https://cdn.jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f4f4f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 12px; transition: 0.3s; box-shadow: 0 4px 8px rgba(0,0,0,0.05); height: 100%; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        .img-container { height: 200px; display: flex; align-items: center; justify-content: center; background: #fff; padding: 15px; border-radius: 12px 12px 0 0; overflow: hidden; }
        .img-container img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .badge-discount { position: absolute; top: 10px; right: 10px; background: #dc3545; color: white; padding: 2px 8px; border-radius: 5px; font-weight: bold; font-size: 0.85rem; z-index: 10; }
        .price { font-size: 1.2rem; color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row mb-4 align-items-center">
        <div class="col-md-6">
            <h2 class="fw-bold text-dark">🛍️ DummyJson</h2>
            <div id="statusLabel" class="badge bg-secondary">Đang kết nối...</div>
        </div>
        <div class="col-md-6 d-flex justify-content-md-end mt-3 mt-md-0">
            <select id="sortSelect" class="form-select w-auto" onchange="currentPage=1; renderUI()">
                <option value="default">Mặc định</option>
                <option value="price-asc">Giá: Thấp đến Cao</option>
                <option value="price-desc">Giá: Cao đến Thấp</option>
                <option value="discount">Giảm giá nhiều nhất</option>
            </select>
        </div>
    </div>

    <div id="productGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
        <!-- Sản phẩm sẽ render ở đây -->
    </div>

    <nav class="mt-5">
        <ul id="pagination" class="pagination justify-content-center"></ul>
    </nav>
</div>

<script>
    let allProducts = [];
    const LIMIT = 8; // Tăng số lượng hiển thị mỗi trang cho đẹp
    let currentPage = 1;

    async function fetchData() {
        const status = document.getElementById('statusLabel');
        try {
            // Fix: Endpoint đúng của DummyJSON
            const res = await fetch('https://dummyjson.com/products');
            if (!res.ok) throw new Error();
            const data = await res.json();
            allProducts = data.products;
            status.innerText = "✅ API Online";
            status.className = "badge bg-success";
        } catch (e) {
            allProducts = [
                { id: 1, title: "iPhone 15 Pro", price: 999, discountPercentage: 5, thumbnail: "https://via.placeholder.com" },
                { id: 2, title: "Laptop Gaming", price: 1500, discountPercentage: 25, thumbnail: "https://via.placeholder.com" },
                { id: 3, title: "Sony Headphone", price: 200, discountPercentage: 50, thumbnail: "https://via.placeholder.com" }
            ];
            status.innerText = "⚠️ Dữ liệu Offline";
            status.className = "badge bg-warning text-dark";
        }
        renderUI();
    }

    function renderUI() {
        const sortVal = document.getElementById('sortSelect').value;
        let list = [...allProducts];

        // 1. Sắp xếp
        if (sortVal === 'price-asc') list.sort((a, b) => a.price - b.price);
        else if (sortVal === 'price-desc') list.sort((a, b) => b.price - a.price);
        else if (sortVal === 'discount') list.sort((a, b) => b.discountPercentage - a.discountPercentage);

        // 2. Phân trang
        const start = (currentPage - 1) * LIMIT;
        const pageItems = list.slice(start, start + LIMIT);

        // 3. Render Card
        const grid = document.getElementById('productGrid');
        if(pageItems.length === 0) {
            grid.innerHTML = '<p class="text-center w-100">Không có sản phẩm nào.</p>';
            return;
        }

        grid.innerHTML = pageItems.map(p => `
            <div class="col">
                <div class="card position-relative">
                    <span class="badge-discount">-${Math.round(p.discountPercentage)}%</span>
                    <div class="img-container">
                        <img src="${p.thumbnail}" alt="${p.title}" loading="lazy">
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h6 class="card-title text-truncate fw-bold" title="${p.title}">${p.title}</h6>
                        <p class="card-text text-muted small text-truncate">${p.description || ''}</p>
                        <div class="mt-auto price">$${p.price.toLocaleString()}</div>
                    </div>
                </div>
            </div>
        `).join('');

        renderPagination(list.length);
    }

    function renderPagination(total) {
        const totalPages = Math.ceil(total / LIMIT);
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                <button class="page-link shadow-none" onclick="changePage(${i})">${i}</button>
            </li>`;
        }
        document.getElementById('pagination').innerHTML = html;
    }

    window.changePage = (p) => {
        currentPage = p;
        renderUI();
        window.scrollTo({ top: 0, behavior: 'smooth' }); // Cuộn lên đầu khi sang trang
    };

    fetchData();
</script>
</body>
</html>
